# Served by Dockerfile.dashboard's nginx:alpine stage. The dashboard uses
# react-router-dom's BrowserRouter (src/App.tsx), so a direct load of a nested
# route (not just "/") has to fall back to index.html — nginx's stock config
# 404s on a path that has no matching file, which is every client-side route
# except "/" itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
